<!DOCTYPE html>
<html>
<head>
    <title>Task Manager</title>

    <style>
        body {
            font-family: Arial;
            max-width: 700px;
            margin: 50px auto;
            background: #f4f4f4;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        form {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 10px;
        }

        button {
            padding: 10px 15px;
            cursor: pointer;
        }

        li {
            margin: 15px 0;
            padding: 10px;
            background: #eee;
            list-style: none;
        }

        .completed {
            text-decoration: line-through;
            color: gray;
        }

        a {
            margin-left: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Task Manager</h1>

    <form action="/add" method="POST">
        <input
            type="text"
            name="title"
            placeholder="Enter a task..."
            required
        >

        <button type="submit">
            Add Task
        </button>
    </form>

    <ul>

        {% for task in tasks %}

        <li>

            {% if task.completed %}
                <span class="completed">
                    {{ task.title }}
                </span>
            {% else %}
                <span>
                    {{ task.title }}
                </span>
            {% endif %}

            {% if not task.completed %}
                <a href="/complete/{{ task.id }}">
                    Complete
                </a>
            {% endif %}

            <a href="/delete/{{ task.id }}">
                Delete
            </a>

        </li>

        {% endfor %}

    </ul>

</div>

</body>
</html>
